name: CI - Code Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brainx
          POSTGRES_USER: brainx
          POSTGRES_PASSWORD: brainx_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: brainx-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: brainx-api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests (Performance Budget < 2m30s)
        timeout-minutes: 4
        env:
          DATABASE_URL: postgres://brainx:brainx_test_password@localhost:5432/brainx
          SECRET_KEY: ci-super-secret-key-brainx-api-testing-jwt-hs256-32bytes
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python manage.py test --parallel

  test-frontend:
    name: Frontend Compilation & Vitest Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: brainx-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: brainx-web/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Check TypeScript & Build Bundle
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm test
