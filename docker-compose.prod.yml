services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - brainx_network

  api:
    build:
      context: ./brainx-api
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-gafclerck}/brainx-api:latest
    restart: unless-stopped
    env_file:
      - ./brainx-api/.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'X-Forwarded-Proto: https' http://localhost:8000/api/v1/healthz/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - brainx_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brainx}
      POSTGRES_USER: ${POSTGRES_USER:-brainx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainx_secure_production_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainx} -d ${POSTGRES_DB:-brainx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brainx_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brainx_network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  brainx_network:
    driver: bridge
